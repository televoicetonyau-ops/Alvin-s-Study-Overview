<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>個人學習概括 · Study Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f6; --card:#ffffff; --border:#e5e5e9; --text:#17171a; --muted:#74747e;
  --accent:#3b6ef5; --sidebar:#ffffff; --hover:#f1f1f4; --danger:#e5484d; --ok:#22a06b;
  --warn:#e8a33d; --radius:12px;
}
html[data-theme="dark"]{
  --bg:#101013; --card:#18181c; --border:#2a2a32; --text:#ececf1; --muted:#8f8f9c;
  --accent:#5b86f7; --sidebar:#151519; --hover:#22222a; --danger:#f2686c; --ok:#3ecf8e;
  --warn:#e8a33d;
}
html,body{height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;min-height:100vh}
#sidebar{
  width:232px;background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:60;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand-icon{font-size:22px}
.brand-title{font-size:15px;font-weight:600;letter-spacing:.02em}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
#nav{flex:1;overflow-y:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;cursor:pointer;
  color:var(--muted);font-size:13.5px;border:none;background:none;width:100%;text-align:left;
  transition:background .13s,color .13s;
}
.nav-item .ni-en{font-size:10.5px;opacity:.7;margin-left:auto;letter-spacing:.02em}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item.active .ni-en{opacity:.8}
.sidebar-foot{padding:10px;border-top:1px solid var(--border)}
#main{flex:1;margin-left:232px;min-width:0;display:flex;flex-direction:column}

#topbar{
  position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:56px;
}
#pageTitle{font-size:15px;font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--border);background:var(--card);font-size:12px;color:var(--muted);white-space:nowrap;
}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.err{color:var(--danger);border-color:var(--danger)}
.pill.pomo{cursor:pointer;user-select:none;color:var(--text);font-variant-numeric:tabular-nums}
.pill.pomo.running{color:var(--accent);border-color:var(--accent)}
#menuBtn{display:none}

#content{padding:18px;max-width:1180px;width:100%;margin:0 auto;flex:1}
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h3{font-size:13.5px;font-weight:600;margin-bottom:12px;letter-spacing:.01em}
.muted{color:var(--muted);font-size:12.5px}
.grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid2>.card{margin-bottom:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;
  border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;
  transition:background .13s,filter .13s;white-space:nowrap;
}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.full{width:100%}
.icon-btn{
  border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:8px;
  width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;padding:0;
}
.icon-btn:hover{background:var(--hover);color:var(--text)}
input,select,textarea{
  padding:8px 11px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  color:var(--text);outline:none;width:100%;font-size:13px;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px;line-height:1.6}
label.fl{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;letter-spacing:.03em}
.field{margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.list-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.list-row:last-child{border-bottom:none}
.tag{
  display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;
  border:1px solid var(--border);color:var(--muted);
}
.due-tag{padding:2px 8px;border-radius:6px;font-size:11px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.due-tag.overdue{color:var(--danger);border-color:var(--danger)}
.due-tag.urgent{color:var(--warn);border-color:var(--warn)}
.empty{padding:20px 0;text-align:center;color:var(--muted);font-size:12.5px}

/* 主控台 */
.dash-hero{
  display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;
  padding:22px 24px;margin-bottom:14px;border-radius:var(--radius);
  background:var(--card);border:1px solid var(--border);
}
.dash-hero h2{font-size:21px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.dash-hero .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
.dash-hero .hero-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dash-hero .hero-chips span{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--hover);border:1px solid var(--border);color:var(--muted)}
.ring-wrap{position:relative;width:98px;height:98px;flex:0 0 98px}
.ring{width:98px;height:98px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bg{stroke:var(--border)}
.ring .fg{stroke:var(--accent);transition:stroke-dasharray .7s cubic-bezier(.4,0,.2,1)}
.ring-label{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-label b{font-size:21px;font-weight:800;line-height:1;letter-spacing:-.5px}
.ring-label small{font-size:9px;color:var(--muted);letter-spacing:.8px;font-weight:650;display:block;margin-top:3px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{padding:14px 16px;margin-bottom:0;display:flex;align-items:center;gap:12px}
.stat-icon{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--hover)}
.stat-num{font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.stat-label{font-size:11px;color:var(--muted);margin-top:1px}

.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash-grid>.card{margin-bottom:0}
@media(max-width:820px){.dash-grid{grid-template-columns:1fr}}

/* 待辦一週 */
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day-col{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:11px;display:flex;flex-direction:column;min-height:190px}
.day-col.today{border-color:var(--accent)}
.day-head{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.day-head .dd{font-size:10.5px;color:var(--muted);font-weight:400}
.day-col.today .day-head{color:var(--accent)}
.task{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;padding:4px 0;line-height:1.4}
.task input[type=checkbox]{width:14px;height:14px;flex-shrink:0;margin-top:2px;accent-color:var(--accent);cursor:pointer}
.task.done span.tx{text-decoration:line-through;color:var(--muted)}
.task .tx{flex:1;word-break:break-word}
.task .del{opacity:.35;cursor:pointer;font-size:11px;padding:0 2px;background:none;border:none;color:inherit}
.task .del:hover{opacity:1;color:var(--danger)}
.day-add{display:flex;gap:4px;margin-top:auto;padding-top:8px}
.day-add input{padding:5px 8px;font-size:12px;border-radius:8px}
.day-add button{padding:0 9px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer}
.day-add button:hover{background:var(--hover)}
@media(max-width:900px){.week-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.week-grid{grid-template-columns:1fr}}

/* 作業/考試 */
.status-sel{padding:4px 8px;border-radius:8px;font-size:11.5px;width:auto}
.s-prog{background:var(--border);border-radius:999px;height:6px;overflow:hidden;margin-top:8px}
.s-prog>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;padding:0;height:22px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--border)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);margin-top:-5px;cursor:pointer}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--border)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl th{color:var(--muted);font-weight:500;font-size:11.5px;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* 減壓空間 */
#view-detox{--dx-bg:#1c1024;--dx-card:#26162f;--dx-border:#3d2449;--dx-text:#f2e8f7;--dx-muted:#a98cbb;--dx-accent:#e07bb0}
.detox-wrap{background:var(--dx-bg);border:1px solid var(--dx-border);border-radius:16px;padding:20px;color:var(--dx-text)}
.detox-wrap h2{font-size:17px;font-weight:600;letter-spacing:.02em}
.detox-wrap h2 span{font-size:11px;color:var(--dx-muted);font-weight:400;letter-spacing:.1em;margin-left:6px;text-transform:uppercase}
.detox-wrap h3{color:var(--dx-text)}
.detox-hero{margin-bottom:18px}
.detox-hero p{color:var(--dx-muted);font-size:12.5px;margin-top:5px}
.dx-card{background:var(--dx-card);border:1px solid var(--dx-border);border-radius:12px;padding:16px;margin-bottom:14px}
.dx-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.dx-grid{grid-template-columns:1fr}}
.quote-box{min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:18px;border-radius:12px;background:#22122b;border:1px solid var(--dx-border)}
.quote-zh{font-size:17px;line-height:1.6;letter-spacing:.01em}
.quote-en{font-size:12.5px;color:var(--dx-muted);font-style:italic}
.detox-wrap textarea{background:#22122b;border-color:var(--dx-border);color:var(--dx-text)}
.detox-wrap textarea:focus{border-color:var(--dx-accent)}
.detox-wrap textarea::placeholder{color:#7d6590}
.dx-btn{padding:8px 14px;border-radius:10px;border:1px solid var(--dx-border);background:#2e1a39;color:var(--dx-text);cursor:pointer;font-size:13px;transition:.13s;display:inline-flex;align-items:center;gap:6px}
.dx-btn:hover{background:#3a2147;border-color:var(--dx-accent)}
.audio-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--dx-border);font-size:13px}
.audio-row:last-child{border-bottom:none}
.audio-row .an{width:78px;flex-shrink:0}
.audio-row input[type=range]{flex:1}
.audio-toggle{width:46px;height:24px;border-radius:999px;border:1px solid var(--dx-border);background:#2a1733;position:relative;cursor:pointer;flex-shrink:0;padding:0;transition:.16s}
.audio-toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#8c74a0;transition:.16s}
.audio-toggle.on{background:var(--dx-accent);border-color:var(--dx-accent)}
.audio-toggle.on::after{left:24px;background:#fff}
#bubbleCanvas,#burnCanvas{width:100%;display:block;border-radius:12px;touch-action:manipulation}
#bubbleCanvas{background:#1a0f21;border:1px solid var(--dx-border);height:340px;cursor:pointer}
#burnCanvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:900;pointer-events:none;border-radius:0}

#toasts{position:fixed;right:16px;bottom:16px;z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 15px;font-size:13px;animation:tin .2s ease;max-width:78vw}
.toast.error{border-color:var(--danger);color:var(--danger)}
.toast.ok{border-color:var(--ok);color:var(--ok)}
.toast.out{opacity:0;transform:translateY(6px);transition:.28s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
@media(max-width:880px){
  #sidebar{transform:translateX(-100%);transition:transform .22s ease;box-shadow:none}
  #sidebar.open{transform:none}
  #main{margin-left:0}
  #menuBtn{display:inline-flex}
  #overlay.show{display:block}
  #content{padding:14px}
  .topbar-right .pill:not(.pomo){display:none}
  #pageTitle{font-size:14px}
  .dash-hero{padding:18px}
  .ring-wrap{width:80px;height:80px;flex-basis:80px}
  .ring{width:80px;height:80px}
}
@media(max-width:520px){
  .stat-grid{grid-template-columns:1fr 1fr}
  #topbar{padding:8px 12px}
  .dash-hero h2{font-size:18px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-icon">📖</span>
      <div>
        <div class="brand-title">學習概括</div>
        <div class="brand-sub">Study Hub</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn full" id="themeBtn">🌙 深色模式</button>
    </div>
  </aside>
  <div id="overlay"></div>
  <div id="main">
    <header id="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="menu">☰</button>
      <h1 id="pageTitle">主控台</h1>
      <div class="topbar-right">
        <span class="pill" id="syncPill">● 僅本地</span>
        <span class="pill" id="datePill"></span>
        <span class="pill pomo" id="pomoPill" title="點擊開始 / 暫停">🍅 <span id="pomoTime">25:00</span></span>
        <button class="icon-btn" id="pomoReset" title="重置番茄鐘">↺</button>
      </div>
    </header>
    <div id="content">
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-todos"></section>
      <section class="view" id="view-homework"></section>
      <section class="view" id="view-exams"></section>
      <section class="view" id="view-feedback"></section>
      <section class="view" id="view-grades"></section>
      <section class="view" id="view-detox"></section>
      <section class="view" id="view-guide"></section>
      <section class="view" id="view-settings"></section>
    </div>
  </div>
</div>
<div id="toasts"></div>
<canvas id="burnCanvas" hidden></canvas>

<script>
/* ==================================================================
   0. 工具函式
   ================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function parseDate(s){ return new Date(s + 'T00:00:00'); }
function addDays(s, n){ const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); }
const todayStr = () => fmtDate(new Date());
function startOfWeek(base = new Date()){
  const d = new Date(base); d.setHours(0,0,0,0);
  const wd = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - wd);
  return fmtDate(d);
}
function daysUntil(dateStr){ const d = parseDate(dateStr); const t = new Date(); t.setHours(0,0,0,0); return Math.round((d - t) / 86400000); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

function toast(msg, type = ''){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2600);
}

/* ==================================================================
   1. 資料層
   ================================================================== */
const LS_KEY = 'studyHub.v2';

const SUBJECTS_DEFAULT = [
  { id:'chinese',  name:'中文',      en:'Chinese Language and Literature',      color:'#e5484d', special:false },
  { id:'english',  name:'英文',      en:'English Language and Literature',      color:'#3b6ef5', special:false },
  { id:'chuman',   name:'中國人文',  en:'Chinese Humanities',                   color:'#e8a33d', special:false },
  { id:'sciences', name:'科學',      en:'Sciences',                             color:'#2fb37a', special:false },
  { id:'pe',       name:'體育',      en:'Physical Health and Education',        color:'#00a2c7', special:false },
  { id:'indiv',    name:'個體與社會', en:'Individuals and Societies',           color:'#ec4899', special:false },
  { id:'math',     name:'數學',      en:'Mathematics',                          color:'#8b5cf6', special:false },
  { id:'geo',      name:'宇宙科學',  en:'GeoScience',                           color:'#f97316', special:true  },
  { id:'matheng',  name:'數學設計',  en:'Mathematics for Engineering',          color:'#14b8a6', special:false },
];

const SPECIAL_CRITERIA = ['筆記本 Notebook', '每課小測驗 Quizzes', '單元大考試 Unit Exam', '上課積極度 Participation'];
const NORMAL_CRITERIA  = ['Criterion A', 'Criterion B', 'Criterion C', 'Criterion D'];
const LADDER_MAP = { '差':2, '待改進':3, '中':4, '良好':5, '優秀':6, '極好':7, '極佳':7.5 };

function defaultState(){
  return {
    updatedAt: Date.now(),
    settings: {
      theme: 'light',
      sync: { provider:'none', supabaseUrl:'', supabaseKey:'', roomId:'',
              jsonbinId:'', jsonbinKey:'', lastSync:0, auto:true }
    },
    subjects: JSON.parse(JSON.stringify(SUBJECTS_DEFAULT)),
    todos: [], homework: [], exams: [], feedback: [], grades: []
  };
}

function normalizeState(raw){
  const d = defaultState();
  if (!raw || typeof raw !== 'object') return d;
  const s = raw;
  const settings = Object.assign({}, d.settings, s.settings || {});
  settings.sync = Object.assign({}, d.settings.sync, (s.settings && s.settings.sync) || {});
  return {
    updatedAt: s.updatedAt || Date.now(),
    settings,
    subjects: (Array.isArray(s.subjects) && s.subjects.length) ? s.subjects : d.subjects,
    todos: Array.isArray(s.todos) ? s.todos : [],
    homework: Array.isArray(s.homework) ? s.homework : [],
    exams: Array.isArray(s.exams) ? s.exams : [],
    feedback: Array.isArray(s.feedback) ? s.feedback : [],
    grades: Array.isArray(s.grades) ? s.grades : []
  };
}

let state;
function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) { state = defaultState(); saveState(); return; }
    state = normalizeState(JSON.parse(raw));
  } catch (e) {
    state = defaultState();
  }
}
function saveState(){
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { toast('儲存失敗：瀏覽器空間不足', 'error'); }
}

function subj(id){ return state.subjects.find(s => s.id === id); }
function subjName(id){ const s = subj(id); return s ? s.name : '未分類'; }
function subjColor(id){ const s = subj(id); return s ? s.color : '#8a8a95'; }
function isSpecial(id){ const s = subj(id); return !!(s && s.special); }
function subjectOptions(sel){
  return state.subjects.map(s =>
    `<option value="${s.id}" ${sel === s.id ? 'selected' : ''}>${esc(s.name)} · ${esc(s.en)}</option>`
  ).join('');
}

/* ==================================================================
   2. MYP 換算
   ================================================================== */
const MYP_BOUNDS = [[28,7],[24,6],[19,5],[15,4],[10,3],[6,2],[0,1]];
function toMYP(total){
  for (const [min, lvl] of MYP_BOUNDS) if (total >= min) return lvl;
  return 1;
}
function parseScore(v){
  if (v === '' || v === null || v === undefined) return null;
  if (typeof v === 'number') return isNaN(v) ? null : clamp(v, 0, 8);
  const s = String(v).trim();
  if (s === '') return null;
  const n = parseFloat(s);
  if (!isNaN(n) && /^[\d.]+$/.test(s)) return clamp(n, 0, 8);
  if (LADDER_MAP[s] !== undefined) return LADDER_MAP[s];
  return null;
}
function calcRecord(rec){
  const nums = (rec.scores || []).map(parseScore).filter(v => v !== null);
  if (!nums.length) return { avg:null, total:null, myp:null, count:0 };
  const avg = nums.reduce((a,b) => a + b, 0) / nums.length;
  const total = avg * 4;
  return { avg, total, myp: toMYP(total), count: nums.length };
}

function buildNav(){
  $('#nav').innerHTML = NAV.map(n => `

      <span class="ni-en">${n.en}</span>
    </button>`).join('');
  $$('#nav .nav-item').forEach(b => { b.onclick = () => navigate(b.dataset.view); });
}

function navigate(v){
  if (currentView === 'detox' && v !== 'detox') AudioEngine.stopAll();
  currentView = v;
  $$('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + v));
  $$('#nav .nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === v));
  const item = NAV.find(n => n.id === v);
  $('#pageTitle').textContent = item.label + ' · ' + item.en;
  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('show');
  renderView(v);
  window.scrollTo({ top:0 });
}

const RENDERERS = {};
function renderView(v){ if (RENDERERS[v]) RENDERERS[v](); }
function rerender(){ renderView(currentView); }

RENDERERS.todos = function(){
  const el = $('#view-todos');
  const ws = startOfWeek();
  const dows = ['一','二','三','四','五','六','日'];
  const days = Array.from({ length:7 }, (_, i) => {
    const date = addDays(ws, i);
    return { date, dow: dows[i], d: parseDate(date) };
  });
  const today = todayStr();

  el.innerHTML = `
    <div class="card">
      <h3>📝 待辦事項 To-Do List</h3>
      <p class="muted">本週 ${ws} ～ ${addDays(ws, 6)}　·　勾選完成、按 ✕ 刪除</p>
    </div>
    <div class="week-grid">
      ${days.map(day => {
        const tasks = state.todos.filter(t => t.date === day.date);
        return `
        <div class="day-col ${day.date === today ? 'today' : ''}">
          <div class="day-head">
            <span>週${day.dow}${day.date === today ? ' · 今天' : ''}</span>
            <span class="dd">${day.d.getMonth() + 1}/${day.d.getDate()}</span>
          </div>
          <div class="day-list">
            ${tasks.length ? tasks.map(t => `
              <div class="task ${t.done ? 'done' : ''}">
                <input type="checkbox" data-tog="${t.uid}" ${t.done ? 'checked' : ''}>
                <span class="tx">${esc(t.text)}</span>
                <button class="del" data-del="${t.uid}">✕</button>
              </div>`).join('') : '<div class="muted" style="font-size:11.5px;padding:4px 0">—</div>'}
          </div>
          <div class="day-add">
            <input type="text" placeholder="新增任務…" data-input="${day.date}">
            <button data-add="${day.date}">+</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  el.onclick = e => {
    const t = e.target;
    if (t.dataset.add){
      const inp = el.querySelector(`input[data-input="${t.dataset.add}"]`);
      const text = (inp.value || '').trim();
      if (!text) return;
      state.todos.push({ uid: uid(), date: t.dataset.add, text, done:false, subjectId:'', createdAt: Date.now() });
      saveState(); rerender();
    }
    if (t.dataset.del){
      state.todos = state.todos.filter(x => x.uid !== t.dataset.del);
      saveState(); rerender();
    }
  };
  el.onchange = e => {
    const t = e.target;
    if (t.dataset.tog){
      const item = state.todos.find(x => x.uid === t.dataset.tog);
      if (item){ item.done = t.checked; saveState(); rerender(); }
    }
  };
  el.onkeydown = e => {
    if (e.key === 'Enter' && e.target.dataset.input){
      const date = e.target.dataset.input;
      const text = e.target.value.trim();
      if (!text) return;
      state.todos.push({ uid: uid(), date, text, done:false, subjectId:'', createdAt: Date.now() });
      saveState(); rerender();
    }
  };
};

const AudioEngine = {
  ctx:null, master:null, noiseBuf:null, brownBuf:null,
  tracks:{}, volumes:{ rain:0.5, waves:0.5, fire:0.45, cafe:0.4, forest:0.4, chime:0.35 },
  builders:{},

  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { toast('此瀏覽器不支援 Web Audio', 'error'); return; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.85;
    this.master.connect(this.ctx.destination);
    this.noiseBuf = this.makeNoise(3, 'white');
    this.brownBuf = this.makeNoise(3, 'brown');
    this._register();
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  makeNoise(sec, type){
    const len = Math.floor(this.ctx.sampleRate * sec);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      if (type === 'brown'){ last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
      else d[i] = w;
    }
    return buf;
  },
  _loopNoise(buf){
    const s = this.ctx.createBufferSource();
    s.buffer = buf; s.loop = true;
    return s;
  },
  _register(){
    const self = this;

    this.builders.rain = function(){
      const ctx = self.ctx;
      const src = self._loopNoise(self.noiseBuf);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 260;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
      const out = ctx.createGain(); out.gain.value = 0.9;
      src.connect(hp); hp.connect(lp); lp.connect(out);
      src.start();
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.3;
      const lg = ctx.createGain(); lg.gain.value = 0.12;
      lfo.connect(lg); lg.connect(out.gain); lfo.start();
      return { out, stop(){ try{ src.stop(); lfo.stop(); }catch(e){} } };
    };

    this.builders.waves = function(){
      const ctx = self.ctx;
      const src = self._loopNoise(self.noiseBuf);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 620; bp.Q.value = 0.7;
      const out = ctx.createGain(); out.gain.value = 0.3;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.085;
      const lg = ctx.createGain(); lg.gain.value = 0.3;
      lfo.connect(lg); lg.connect(out.gain); lfo.start();
      src.connect(bp); bp.connect(out);
      src.start();
      return { out, stop(){ try{ src.stop(); lfo.stop(); }catch(e){} } };
    };

    this.builders.fire = function(){
      const ctx = self.ctx;
      const src = self._loopNoise(self.brownBuf);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 760;
      const out = ctx.createGain(); out.gain.value = 0.85;
      src.connect(lp); lp.connect(out);
      src.start();
      const timer = setInterval(() => { if (Math.random() < 0.7) self._crackle(out); }, 170);
      return { out, stop(){ clearInterval(timer); try{ src.stop(); }catch(e){} } };
    };

    this.builders.cafe = function(){
      const ctx = self.ctx;
      const src = self._loopNoise(self.brownBuf);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
      const out = ctx.createGain(); out.gain.value = 0.9;
      src.connect(lp); lp.connect(out);
      src.start();
      const timer = setInterval(() => {
        const r = Math.random();
        if (r < 0.28) self._clink(out);
        else if (r < 0.42) self._murmur(out);
      }, 900);
      return { out, stop(){ clearInterval(timer); try{ src.stop(); }catch(e){} } };
    };

    this.builders.forest = function(){
      const ctx = self.ctx;
      const src = self._loopNoise(self.noiseBuf);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700;
      const out = ctx.createGain(); out.gain.value = 0.5;
      src.connect(lp); lp.connect(out);
      src.start();
      const timer = setInterval(() => { if (Math.random() < 0.5) self._chirp(out); }, 1200);
      return { out, stop(){ clearInterval(timer); try{ src.stop(); }catch(e){} } };
    };

    this.builders.chime = function(){
      const ctx = self.ctx;
      const out = ctx.createGain(); out.gain.value = 0.9;
      const timer = setInterval(() => { if (Math.random() < 0.55) self._chimeSound(out); }, 1400);
      return { out, stop(){ clearInterval(timer); } };
    };
  },

  _crackle(out){
    const ctx = this.ctx, t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuf;
    src.playbackRate.value = 1 + Math.random();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 1100 + Math.random() * 2600; bp.Q.value = 6;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.08 + Math.random() * 0.22, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.07);
    src.connect(bp); bp.connect(g); g.connect(out);
    src.start(t); src.stop(t + 0.1);
  },
  _clink(out){
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.value = 1600 + Math.random() * 1800;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 0.28);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.3);
  },
  _murmur(out){
    const ctx = this.ctx, t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = this.brownBuf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 320; bp.Q.value = 2.5;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.14, t + 0.35);
    g.gain.linearRampToValueAtTime(0, t + 1.5);
    src.connect(bp); bp.connect(g); g.connect(out);
    src.start(t); src.stop(t + 1.6);
  },
  _chirp(out){
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    const f0 = 1800 + Math.random() * 1300;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.65, t + 0.06);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.9, t + 0.15);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.09, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0004, t + 0.18);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.2);
  },
  _chimeSound(out){
    const ctx = this.ctx, t = ctx.currentTime;
    const PENTA = [523.25, 587.33, 698.46, 783.99, 880.0, 1046.5, 1174.66];
    const f = PENTA[Math.floor(Math.random() * PENTA.length)];
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.01;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.11, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0004, t + 2.4);
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(out);
    o.start(t); o2.start(t); o.stop(t + 2.5); o2.stop(t + 2.5);
  },

  start(id){
    this.init();
    if (!this.ctx) return;
    this.resume();
    if (this.tracks[id]) return;
    const builder = this.builders[id];
    if (!builder) return;
    const t = builder();
    const vol = this.ctx.createGain();
    vol.gain.value = this.volumes[id] ?? 0.5;
    t.out.connect(vol);
    vol.connect(this.master);
    this.tracks[id] = { ...t, vol };
  },
  stop(id){
    const t = this.tracks[id];
    if (!t) return;
    try { t.stop(); } catch(e){}
    try { t.vol.disconnect(); } catch(e){}
    delete this.tracks[id];
  },
  stopAll(){ Object.keys(this.tracks).forEach(id => this.stop(id)); },
  setVolume(id, v){
    this.volumes[id] = v;
    if (this.tracks[id]) this.tracks[id].vol.gain.value = v;
  },
  playPop(){
    this.init();
    if (!this.ctx) return;
    this.resume();
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(680 + Math.random() * 420, t);
    o.frequency.exponentialRampToValueAtTime(170, t + 0.09);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.22, t);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 0.13);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.15);
  }
};

let bubbleCanvas = null, bubbleCtx = null, bubbleList = [], bubbleRAF = null, bubbleSparks = [];

function startBubbleLoop(){
  if (bubbleRAF) return;
  bubbleRAF = requestAnimationFrame(bubbleLoop);
}
function bubbleLoop(){
  if (currentView !== 'detox' || !bubbleCanvas || !bubbleCanvas.isConnected){
    bubbleRAF = null; bubbleList = []; bubbleSparks = [];
    return;
  }
  const cvs = bubbleCanvas, ctx = bubbleCtx;
  const w = cvs.clientWidth, h = cvs.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  if (cvs.width !== Math.round(w * dpr) || cvs.height !== Math.round(h * dpr)){
    cvs.width = Math.round(w * dpr);
    cvs.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  if (Math.random() < 0.045 && bubbleList.length < 26){
    bubbleList.push({
      x: 30 + Math.random() * (w - 60),
      y: h + 30,
      r: 11 + Math.random() * 24,
      vy: 0.35 + Math.random() * 0.95,
      wob: Math.random() * Math.PI * 2,
      ws: 0.008 + Math.random() * 0.02,
      hue: 275 + Math.random() * 65,
      cx: 0
    });
  }

  for (let i = bubbleList.length - 1; i >= 0; i--){
    const b = bubbleList[i];
    b.y -= b.vy;
    b.wob += b.ws;
    b.cx = b.x + Math.sin(b.wob) * 9;
    if (b.y + b.r < -20){ bubbleList.splice(i, 1); continue; }
    const g = ctx.createRadialGradient(b.cx - b.r * 0.32, b.y - b.r * 0.32, b.r * 0.08, b.cx, b.y, b.r);
    g.addColorStop(0, `hsla(${b.hue},100%,92%,0.55)`);
    g.addColorStop(0.55, `hsla(${b.hue},80%,70%,0.10)`);
    g.addColorStop(1, `hsla(${b.hue},90%,68%,0.34)`);
    ctx.beginPath();
    ctx.arc(b.cx, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = `hsla(${b.hue},95%,85%,0.42)`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for (let i = bubbleSparks.length - 1; i >= 0; i--){
    const p = bubbleSparks[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 1;
    if (p.life <= 0){ bubbleSparks.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (p.life / p.max), 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue},95%,80%,${p.life / p.max})`;
    ctx.fill();
  }

  bubbleRAF = requestAnimationFrame(bubbleLoop);
}

function burnParticles(mode, rect){
  const cvs = document.getElementById('burnCanvas');
  cvs.hidden = false;
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  cvs.width = Math.round(W * dpr);
  cvs.height = Math.round(H * dpr);
  const ctx = cvs.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cfg = {
    burn:  { colors:['#ff9a3c','#ff5e3a','#ffd166','#ffb703'], vy:[-2.6,-0.9], vx:[-1.1,1.1], g:-0.006, life:[60,110], size:[1.4,3.6] },
    wash:  { colors:['#4fc3f7','#29b6f6','#81d4fa','#0288d1'], vy:[0.4,1.6],  vx:[-0.8,0.8], g:0.02,   life:[70,130], size:[1.6,4.0] },
    blow:  { colors:['#e8e8f0','#c8c8dc','#b9b9cf'],           vy:[-1.0,0.6], vx:[1.2,3.4],  g:0.004,  life:[55,110], size:[1.2,3.0] }
  }[mode];

  const parts = [];
  for (let i = 0; i < 240; i++){
    parts.push({
      x: rect.left + Math.random() * rect.width,
      y: rect.top + Math.random() * rect.height,
      vx: cfg.vx[0] + Math.random() * (cfg.vx[1] - cfg.vx[0]),
      vy: cfg.vy[0] + Math.random() * (cfg.vy[1] - cfg.vy[0]),
      g: cfg.g,
      color: cfg.colors[Math.floor(Math.random() * cfg.colors.length)],
      max: cfg.life[0] + Math.random() * (cfg.life[1] - cfg.life[0]),
      life: 0,
      r: cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0])
    });
  }

  function frame(){
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts){
      p.life++;
      if (p.life > p.max) continue;
      alive++;
      p.vy += p.g;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      const t = 1 - p.life / p.max;
      ctx.globalAlpha = t;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.4 + t * 0.9), 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      if (mode === 'burn' && Math.random() < 0.25){
        ctx.beginPath();
        ctx.arc(p.x + (Math.random() - 0.5) * 6, p.y + (Math.random() - 0.5) * 6, p.r * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,120,40,.5)';
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (alive > 0) requestAnimationFrame(frame);
    else { cvs.hidden = true; ctx.clearRect(0, 0, W, H); }
  }
  requestAnimationFrame(frame);
}

        AudioEngine.playPop();
        break;
      }
    }
  };
};

      </div>` : '<p class="muted">選擇後端後即可填入連線資訊。兩台裝置填相同房間 ID 即可同步。</p>'}
    </div>

    <div class="card">
      <h3>📚 科目管理</h3>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>名稱</th><th>English</th><th>顏色</th><th>特殊</th><th></th></tr></thead>
        <tbody>
          ${state.subjects.map(sub => `
            <tr>
              <td><input type="text" value="${esc(sub.name)}" data-subname="${sub.id}" style="min-width:90px"></td>
              <td><input type="text" value="${esc(sub.en)}" data-suben="${sub.id}" style="min-width:190px"></td>
              <td><input type="color" value="${sub.color}" data-subcolor="${sub.id}" style="width:44px;height:30px;padding:2px;cursor:pointer"></td>
              <td><input type="checkbox" ${sub.special ? 'checked' : ''} data-subspecial="${sub.id}" style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer"></td>
              <td style="text-align:right"><button class="icon-btn" data-subdel="${sub.id}">✕</button></td>
            </tr>`).join('')}
        </tbody>
      </table></div>
      <div class="row wrap" style="margin-top:12px">
        <input type="text" id="newSubName" placeholder="新科目名稱" style="flex:1;min-width:140px">
        <input type="text" id="newSubEn" placeholder="English name" style="flex:2;min-width:170px">
        <input type="color" id="newSubColor" value="#3b6ef5" style="width:48px;height:36px;padding:2px;cursor:pointer">
        <button class="btn primary" id="addSubject">＋ 新增</button>
      </div>
      <p class="muted" style="margin-top:9px">勾選「特殊」後，成績單會改用四項自訂標準（筆記本 / 小測驗 / 大考試 / 積極度），並自動換算 32 分制。</p>
    </div>

    <div class="card">
      <h3>ℹ️ 關於</h3>
      <p class="muted">
        個人學習概括 Study Hub · 單一 HTML 檔案應用<br>
        資料存於 localStorage（key: <code>${LS_KEY}</code>）。
      </p>
    </div>`;

  el.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'themeToggle2'){ toggleTheme(); }
    if (b.id === 'exportBtn'){
      const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `study-hub-${todayStr()}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('已匯出 JSON ⬇️', 'ok');
    }
    if (b.id === 'importBtn'){ el.querySelector('#importFile').click(); }
    if (b.id === 'resetBtn'){
      if (confirm('確定要重設所有資料嗎？此動作無法復原！')) {
        if (confirm('再次確認：真的要清除全部資料嗎？')) {
          localStorage.removeItem(LS_KEY);
          state = defaultState();
          saveState(); applyTheme(); rerender();
          toast('已重設所有資料', 'ok');
        }
      }
    }
    if (b.id === 'addSubject'){
      const name = el.querySelector('#newSubName').value.trim();
      const en = el.querySelector('#newSubEn').value.trim();
      const color = el.querySelector('#newSubColor').value;
      if (!name){ toast('請輸入科目名稱', 'error'); return; }
      state.subjects.push({ id: uid(), name, en: en || name, color, special:false });
      saveState(); rerender(); toast('已新增科目 ✅', 'ok');
    }
    if (b.dataset.subdel){
      if (confirm('刪除此科目？既有紀錄會顯示為「未分類」。')){
        state.subjects = state.subjects.filter(x => x.id !== b.dataset.subdel);
        saveState(); rerender();
      }
    }
    if (b.id === 'syncNow'){ doSync('auto', true); }
    if (b.id === 'syncUp'){ doSync('upload'); }
    if (b.id === 'syncDown'){ doSync('download'); }
  };

  el.onchange = e => {
    const t = e.target;
    if (t.id === 'syncProvider'){ state.settings.sync.provider = t.value; saveState(); rerender(); }
    if (t.id === 'syncAuto'){ state.settings.sync.auto = t.checked; saveState(); }
    if (t.id === 'importFile'){
      const f = t.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          state = normalizeState(data);
          saveState(); applyTheme(); rerender();
          toast('匯入成功 ✅', 'ok');
        } catch(err){ toast('匯入失敗：檔案格式錯誤', 'error'); }
      };
      reader.readAsText(f);
    }
    if (t.dataset.subname){
      const s2 = state.subjects.find(x => x.id === t.dataset.subname);
      if (s2){ s2.name = t.value; saveState(); }
    }
    if (t.dataset.suben){
      const s2 = state.subjects.find(x => x.id === t.dataset.suben);
      if (s2){ s2.en = t.value; saveState(); }
    }
    if (t.dataset.subcolor){
      const s2 = state.subjects.find(x => x.id === t.dataset.subcolor);
      if (s2){ s2.color = t.value; saveState(); }
    }
    if (t.dataset.subspecial){
      const s2 = state.subjects.find(x => x.id === t.dataset.subspecial);
      if (s2){ s2.special = t.checked; saveState(); }
    }
  };

  el.oninput = e => {
    const t = e.target;
    if (t.dataset.sync){
      state.settings.sync[t.dataset.sync] = t.value;
      saveState(); updateSyncPill();
    }
  };
};

/* ==================================================================
   13. 雲端同步
   ================================================================== */
function updateSyncPill(status){
  const p = $('#syncPill');
  const s = state.settings.sync;
  p.className = 'pill';
  if (status === 'syncing'){ p.textContent = '🔄 同步中…'; return; }
  if (status === 'ok'){ p.textContent = '● 已同步'; p.classList.add('ok'); return; }
  if (status === 'error'){ p.textContent = '● 同步錯誤'; p.classList.add('err'); return; }
  if (s.provider === 'none'){ p.textContent = '● 僅本地'; return; }
  p.textContent = s.lastSync ? '● 已連線' : '● 待同步';
}

function syncConfigured(){
  const s = state.settings.sync;
  if (s.provider === 'supabase') return !!(s.supabaseUrl && s.supabaseKey && s.roomId);
  if (s.provider === 'jsonbin')  return !!(s.jsonbinId && s.jsonbinKey);
  return false;
}

async function cloudGet(){
  const s = state.settings.sync;
  if (s.provider === 'supabase'){
    const base = s.supabaseUrl.replace(/\/+$/, '');
    const url = `${base}/rest/v1/study_sync?room_id=eq.${encodeURIComponent(s.roomId)}&select=*`;
    const res = await fetch(url, {
      headers: { apikey: s.supabaseKey, Authorization: 'Bearer ' + s.supabaseKey }
    });
    if (!res.ok) throw new Error('Supabase 讀取失敗 ' + res.status);
    const rows = await res.json();
    if (!rows || !rows.length) return null;
    return { data: rows[0].data, updatedAt: Number(rows[0].updated_at) || 0 };
  }
  if (s.provider === 'jsonbin'){
    const res = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(s.jsonbinId)}/latest`, {
      headers: { 'X-Master-Key': s.jsonbinKey }
    });
    if (!res.ok) throw new Error('JSONBin 讀取失敗 ' + res.status);
    const j = await res.json();
    const rec = j.record;
    if (!rec) return null;
    if (rec.data && rec.updatedAt !== undefined){
      return { data: rec.data, updatedAt: Number(rec.updatedAt) || 0 };
    }
    return { data: rec, updatedAt: Number(rec.updatedAt) || 0 };
  }
  throw new Error('未設定同步後端');
}

async function cloudPut(){
  const s = state.settings.sync;
  if (s.provider === 'supabase'){
    const base = s.supabaseUrl.replace(/\/+$/, '');
    const res = await fetch(`${base}/rest/v1/study_sync?on_conflict=room_id`, {
      method: 'POST',
      headers: {
        apikey: s.supabaseKey,
        Authorization: 'Bearer ' + s.supabaseKey,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ room_id: s.roomId, data: state, updated_at: state.updatedAt })
    });
    if (!res.ok){
      const txt = await res.text().catch(() => '');
      throw new Error('Supabase 寫入失敗 ' + res.status + ' ' + txt.slice(0, 120));
    }
    return;
  }
  if (s.provider === 'jsonbin'){
    const payload = { data: state, updatedAt: state.updatedAt };
    const res = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(s.jsonbinId)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': s.jsonbinKey },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('JSONBin 寫入失敗 ' + res.status);
    return;
  }
  throw new Error('未設定同步後端');
}

let syncing = false;
async function doSync(mode = 'auto', silent = false){
  if (syncing) return;
  if (!syncConfigured()){
    if (!silent) toast('請先完成同步設定', 'error');
    return;
  }
  syncing = true;
  updateSyncPill('syncing');
  try {
    const cloud = await cloudGet();

    if (mode === 'upload'){
      await cloudPut();
      state.settings.sync.lastSync = Date.now();
      saveState();
      updateSyncPill('ok');
      if (!silent) toast('已上傳至雲端 ☁️', 'ok');
    }
    else if (mode === 'download'){
      if (!cloud){ toast('雲端沒有資料', 'error'); }
      else {
        state = normalizeState(cloud.data);
        state.settings.sync.lastSync = Date.now();
        state.updatedAt = Date.now();
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        applyTheme(); rerender(); updateSyncPill('ok');
        if (!silent) toast('已從雲端下載 ⬇️', 'ok');
      }
    }
    else {
      if (!cloud){
        await cloudPut();
        state.settings.sync.lastSync = Date.now(); saveState();
        updateSyncPill('ok');
      } else if (state.updatedAt > (cloud.updatedAt || 0)){
        await cloudPut();
        state.settings.sync.lastSync = Date.now(); saveState();
        updateSyncPill('ok');
        if (!silent) toast('已同步（上傳）☁️', 'ok');
      } else if ((cloud.updatedAt || 0) > state.updatedAt){
        state = normalizeState(cloud.data);
        state.settings.sync.lastSync = Date.now();
        state.updatedAt = Date.now();
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        applyTheme(); rerender();
        updateSyncPill('ok');
        if (!silent) toast('已同步（下載）⬇️', 'ok');
      } else {
        state.settings.sync.lastSync = Date.now(); saveState();
        updateSyncPill('ok');
        if (!silent) toast('已是最新狀態 ✅', 'ok');
      }
    }
  } catch (err){
    console.error(err);
    updateSyncPill('error');
    if (!silent) toast(err.message || '同步失敗', 'error');
  } finally {
    syncing = false;
  }
}

/* ==================================================================
   14. 主題 / 番茄鐘 / 日期
   ================================================================== */
function applyTheme(){
  document.documentElement.dataset.theme = state.settings.theme;
  const btn = $('#themeBtn');
  btn.textContent = state.settings.theme === 'dark' ? '☀️ 淺色模式' : '🌙 深色模式';
}
function toggleTheme(){
  state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
  saveState(); applyTheme();
  if (currentView === 'settings') rerender();
}

const POMO_TOTAL = 25 * 60;
let pomoLeft = POMO_TOTAL, pomoTimer = null, pomoRunning = false;
function renderPomo(){
  const m = Math.floor(pomoLeft / 60), s = pomoLeft % 60;
  $('#pomoTime').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  $('#pomoPill').classList.toggle('running', pomoRunning);
}
function pomoTick(){
  pomoLeft--;
  if (pomoLeft <= 0){
    pomoLeft = 0;
    renderPomo();
    clearInterval(pomoTimer); pomoTimer = null; pomoRunning = false;
    renderPomo();
    toast('🍅 25 分鐘完成！休息一下吧', 'ok');
    beep();
    return;
  }
  renderPomo();
}
function togglePomo(){
  if (pomoRunning){
    clearInterval(pomoTimer); pomoTimer = null; pomoRunning = false;
  } else {
    if (pomoLeft <= 0) pomoLeft = POMO_TOTAL;
    pomoTimer = setInterval(pomoTick, 1000);
    pomoRunning = true;
  }
  renderPomo();
}
function resetPomo(){
  clearInterval(pomoTimer); pomoTimer = null; pomoRunning = false;
  pomoLeft = POMO_TOTAL;
  renderPomo();
}
function beep(){
  try {
    AudioEngine.init();
    if (!AudioEngine.ctx) return;
    AudioEngine.resume();
    const ctx = AudioEngine.ctx, t = ctx.currentTime;
    [880, 1174].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t + i * 0.18);
      g.gain.linearRampToValueAtTime(0.16, t + i * 0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0005, t + i * 0.18 + 0.4);
      o.connect(g); g.connect(ctx.destination);
      o.start(t + i * 0.18); o.stop(t + i * 0.18 + 0.45);
    });
  } catch(e){}
}

function updateDatePill(){
  const d = new Date();
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  $('#datePill').textContent = `${d.getMonth() + 1}月${d.getDate()}日 週${w}`;
}

/* ==================================================================
   15. 初始化
   ================================================================== */
function init(){
  loadState();
  applyTheme();
  buildNav();

  $('#themeBtn').onclick = toggleTheme;
  $('#menuBtn').onclick = () => {
    $('#sidebar').classList.toggle('open');
    $('#overlay').classList.toggle('show');
  };
  $('#overlay').onclick = () => {
    $('#sidebar').classList.remove('open');
    $('#overlay').classList.remove('show');
  };

  $('#pomoPill').onclick = togglePomo;
  $('#pomoReset').onclick = resetPomo;
  renderPomo();
  updateDatePill();
  setInterval(updateDatePill, 60000);

  navigate('dashboard');
  updateSyncPill();

  setInterval(() => {
    if (state.settings.sync.provider !== 'none' && state.settings.sync.auto !== false) doSync('auto', true);
  }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.settings.sync.provider !== 'none' && state.settings.sync.auto !== false){
      doSync('auto', true);
    }
  });
  window.addEventListener('online', () => {
    if (state.settings.sync.provider !== 'none' && state.settings.sync.auto !== false){
      toast('網路已恢復，正在同步…');
      doSync('auto', true);
    }
  });
  window.addEventListener('offline', () => updateSyncPill('error'));
}

document.addEventListener('DOMContentLoaded', init);
</script>
